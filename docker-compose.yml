services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pos}
      POSTGRES_USER: ${DB_USER:-pos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pos}
      DB_USER: ${DB_USER:-pos}
      DB_PASSWORD: ${DB_PASSWORD:-pos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # No default: the stack refuses to start without a real secret (see .env.example).
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (generate with openssl rand -base64 48)}"
      # Optional first administrator, created at startup when no account with that email exists.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TAX_DEFAULT_RATE_PERCENT: ${TAX_DEFAULT_RATE_PERCENT:-0}
      TAX_STANDARD_RATE_PERCENT: ${TAX_STANDARD_RATE_PERCENT:-0}
      TAX_PRICES_INCLUDE_TAX: ${TAX_PRICES_INCLUDE_TAX:-false}
      DISCOUNT_CASHIER_MAX_PERCENT: ${DISCOUNT_CASHIER_MAX_PERCENT:-15}
      DISCOUNT_MANAGER_MAX_PERCENT: ${DISCOUNT_MANAGER_MAX_PERCENT:-50}
      DISCOUNT_ADMIN_MAX_PERCENT: ${DISCOUNT_ADMIN_MAX_PERCENT:-100}
      STORE_NAME: ${STORE_NAME:-Stockora Supermarket}
      STORE_ADDRESS: ${STORE_ADDRESS:-}
      STORE_PHONE: ${STORE_PHONE:-}
      STORE_TAX_ID: ${STORE_TAX_ID:-}
      STORE_RECEIPT_FOOTER: ${STORE_RECEIPT_FOOTER:-Thank you for shopping with us!}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
