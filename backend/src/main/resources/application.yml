spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos}
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

pos:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Tax and discount rules. Rates are percentages. Prices are tax-EXCLUSIVE unless
  # prices-include-tax is true. Unknown tax classes fall back to default-rate-percent (0 = no tax).
  pricing:
    tax:
      default-rate-percent: ${TAX_DEFAULT_RATE_PERCENT:0}
      prices-include-tax: ${TAX_PRICES_INCLUDE_TAX:false}
      rates-percent:
        STANDARD: ${TAX_STANDARD_RATE_PERCENT:0}
        ZERO: 0
    discount:
      cashier-max-percent: ${DISCOUNT_CASHIER_MAX_PERCENT:15}
      manager-max-percent: ${DISCOUNT_MANAGER_MAX_PERCENT:50}
      admin-max-percent: ${DISCOUNT_ADMIN_MAX_PERCENT:100}
  # Printed on receipts.
  store:
    name: ${STORE_NAME:Stockora Supermarket}
    address: ${STORE_ADDRESS:}
    phone: ${STORE_PHONE:}
    tax-id: ${STORE_TAX_ID:}
    footer: ${STORE_RECEIPT_FOOTER:Thank you for shopping with us!}
  # Optional first-run administrator. Leave unset to create no account.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}

logging:
  level:
    com.pos: INFO
